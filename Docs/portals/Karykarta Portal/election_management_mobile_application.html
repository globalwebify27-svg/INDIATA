      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 9999px;
    }
    /* Touch Optimizations */
    button, a, input, select, textarea {
      touch-action: manipulation;
    }
    /* Mobile Device Frame styling */
    .mobile-frame-shadow {
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 0 0 12px #1e293b, 0 0 0 14px #475569;
    }
    @media (max-width: 640px) {
      .mobile-frame-shadow {
        box-shadow: none !important;
      }
    }

    @keyframes feedPaper {
      0% { transform: translateY(-20px); opacity: 0; }

      animation: feedPaper 0.4s ease-out forwards;
    }

  <script>
    /* ========================================================================
       NAVIGATION & ROUTER SYSTEM
       ======================================================================== */

    function navigateTo(screenId, pushHistory = true) {
      // STRICT PERMISSION GUARD: Karyakarta role can NEVER open candidate-exclusive screens
      if (state.role === 'karyakarta' && isAdminScreen(screenId)) {
        showToast('Access Denied: Candidate Admin privilege required!', 'error');
        return;
      }

      if (pushHistory && state.currentScreen !== screenId) {
        state.screenHistory.push(screenId);
      }
      state.currentScreen = screenId;
      document.getElementById('quickScreenJump').value = screenId;

      // Update Screen Indicator on Top Bar
      const indicator = document.getElementById('screenIndicator');
      if (indicator) indicator.textContent = 'Screen: ' + screenId;

      // Check Candidate Admin Mandatory Red Banner (Shows ONLY on Candidate-exclusive screens)
      const adminBanner = document.getElementById('candidateAdminBanner');
      const isCandidateOnly = isAdminScreen(screenId);
      if (isCandidateOnly) {
        adminBanner.classList.remove('hidden');
      } else {
        adminBanner.classList.add('hidden');
      }

      // Update Navigation Bars visibility
      const kkBottomNav = document.getElementById('karyakartaBottomNav');
      const adminBottomNav = document.getElementById('candidateAdminBottomNav');
      const backBtn = document.getElementById('backButton');

      // Back Button logic
      if (['welcome', 'kk_dashboard', 'admin_dashboard'].includes(screenId)) {
        backBtn.classList.add('hidden');
      } else {
        backBtn.classList.remove('hidden');
      }

      // Role-Aware Bottom Navigation:
      // Candidate Admin retains the comprehensive Candidate Admin bar across BOTH Admin and Karyakarta screens!
      if (state.role === 'candidate_admin' && screenId !== 'admin_login' && screenId !== 'welcome') {
        adminBottomNav.classList.remove('hidden');
        kkBottomNav.classList.add('hidden');
        updateAdminNavHighlight(screenId);
      } else if (state.role === 'karyakarta' && ['kk_dashboard', 'search_voter', 'voter_list', 'adv_search', 'kk_issues_home', 'kk_ai_mode', 'settings_kk'].includes(screenId)) {
        kkBottomNav.classList.remove('hidden');
        adminBottomNav.classList.add('hidden');
        updateKkNavHighlight(screenId);
      } else {
        // Welcome, Login, and full-screen flows
        kkBottomNav.classList.add('hidden');
        adminBottomNav.classList.add('hidden');
      }

      // Update Top App Title
      updateHeaderTitles(screenId);

      // Render the Target Screen
      renderScreen(screenId);

      // Scroll viewport back to top
      const viewport = document.getElementById('screenViewport');
      if (viewport) viewport.scrollTop = 0;
    }

    function navigateBack() {
      if (state.screenHistory.length > 1) {
        state.screenHistory.pop(); // Remove current
        const prev = state.screenHistory[state.screenHistory.length - 1];
        navigateTo(prev, false);
      } else {
        navigateTo('welcome', false);
      }
    }

    function updateKkNavHighlight(screenId) {
      document.querySelectorAll('.kk-nav-btn').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        if (target === screenId || (screenId === 'voter_list' && target === 'search_voter') || (screenId === 'adv_search' && target === 'search_voter')) {
          btn.classList.add('text-brand-600', 'dark:text-brand-400', 'font-bold');
          btn.classList.remove('text-slate-500', 'dark:text-slate-400');
        } else {
          btn.classList.remove('text-brand-600', 'dark:text-brand-400', 'font-bold');
          btn.classList.add('text-slate-500', 'dark:text-slate-400');
        }
      });
    }

    function updateAdminNavHighlight(screenId) {
      document.querySelectorAll('.admin-nav-btn').forEach(btn => {
        const target = btn.getAttribute('data-nav');
        if (target === screenId) {
          btn.classList.add('text-brand-400', 'font-bold');
        } else {
          btn.classList.remove('text-brand-400', 'font-bold');
        }
      });
    }

    function renderVoterResultsHtml(votersList) {
      if (votersList.length === 0) {
        return `

            <div onclick="openVoterProfile('${v.id}')" class="bg-white dark:bg-slate-900 p-3 rounded-xl border border-slate-200 dark:border-slate-800 hover:border-brand-500 cursor-pointer shadow-sm text-xs space-y-1.5 transition-all">
              <div class="flex justify-between items-start">
                <div>
                  <div class="flex items-center gap-1.5">
                    <h4 class="font-bold text-slate-900 dark:text-white">${v.name}</h4>
                    ${v.isImportant ? '<i class="fas fa-star text-amber-500 text-[10px]"></i>' : ''}

                  <p class="text-[10px] text-slate-500">EPIC: <span class="font-mono font-semibold text-slate-700 dark:text-slate-300">${v.epic}</span> | Age: ${v.age} (${v.gender})</p>
                </div>
                <span class="px-2 py-0.5 rounded text-[9px] font-bold ${getClassificationBadge(v.classification)}">${v.classification}</span>
              </div>

              <div class="flex items-center justify-between text-[10px] text-slate-400 pt-1 border-t border-slate-100 dark:border-slate-800">
                <span><i class="fas fa-house text-[9px] mr-0.5"></i> ${v.houseNo}, ${v.address}</span>
                <span class="font-semibold text-slate-600 dark:text-slate-300">${v.boothNo}</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function getClassificationBadge(status) {
      switch (status) {
        case 'Supporter': return 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300';
        case 'Opponent': return 'bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300';
        case 'Doubtful': return 'bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300';
        default: return 'bg-slate-100 text-slate-800 dark:bg-slate-800 dark:text-slate-300';
      }
    }

    function filterVotersList(term) {
      const q = term.toLowerCase().trim();
      if (!q) {
        document.getElementById('voterResultsContainer').innerHTML = renderVoterResultsHtml(state.voters);
        return;
      }
      const filtered = state.voters.filter(v =>
        v.name.toLowerCase().includes(q) ||
        v.epic.toLowerCase().includes(q) ||
        v.mobile.includes(q) ||
        v.houseNo.toLowerCase().includes(q) ||
        v.address.toLowerCase().includes(q)
      );
      document.getElementById('voterResultsContainer').innerHTML = renderVoterResultsHtml(filtered);
    }

    function setSearchTerm(term) {
      document.getElementById('voterSearchInput').value = term;
      filterVotersList(term);
    }

    function clearSearchInput() {
      document.getElementById('voterSearchInput').value = '';
      filterVotersList('');
    }

    function renderVoterListScreen() {
      return renderSearchVoterScreen();
    }

              </button>

          </form>
        </div>
      `;
    }

    function applyAdvancedFilters(e) {
      e.preventDefault();
      const booth = document.getElementById('filterBooth').value;
      const gender = document.getElementById('filterGender').value;
      const visited = document.getElementById('filterVisited').value;

      let res = state.voters;
      if (booth) res = res.filter(v => v.boothNo === booth);
      if (gender) res = res.filter(v => v.gender === gender);
      if (visited === 'visited') res = res.filter(v => v.visited);
      if (visited === 'unvisited') res = res.filter(v => !v.visited);

      showToast(`Filter applied: ${res.length} voters matched`, 'info');
      navigateTo('search_voter');
      document.getElementById('voterResultsContainer').innerHTML = renderVoterResultsHtml(res);
    }

    function clearAllFilters() {
      document.getElementById('advFilterForm').reset();
      showToast('Filters cleared', 'info');
    }

          <button onclick="navigateTo('live_map'); closeRoleDrawer()" class="w-full text-left p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-xs flex items-center gap-2 text-rose-600">
            <i class="fas fa-map-location-dot text-rose-600 text-xs w-4"></i> Live GPS Field Map
          </button>

          <!-- Complete Karyakarta Field Operations (Direct Candidate Access) -->
          <div class="px-2 py-1 text-[9px] font-black uppercase tracking-wider text-blue-600 dark:text-blue-400 bg-blue-50 dark:bg-blue-950/40 rounded mt-2.5 mb-1">
            Karyakarta Field Suite (All Features)
          </div>
          <button onclick="navigateTo('search_voter'); closeRoleDrawer()" class="w-full text-left p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-xs flex items-center gap-2">
            <i class="fas fa-magnifying-glass text-blue-600 text-xs w-4"></i> Voter Roll Search
          </button>
          <button onclick="navigateTo('adv_search'); closeRoleDrawer()" class="w-full text-left p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-xs flex items-center gap-2">
            <i class="fas fa-sliders text-blue-600 text-xs w-4"></i> Advanced Filters
          </button>
          <button onclick="navigateTo('bulk_survey_select'); closeRoleDrawer()" class="w-full text-left p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-xs flex items-center gap-2">
            <i class="fas fa-list-check text-emerald-600 text-xs w-4"></i> Doorstep & Bulk Surveys
          </button>
          <button onclick="navigateTo('slip_generator'); closeRoleDrawer()" class="w-full text-left p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-xs flex items-center gap-2">
            <i class="fas fa-receipt text-indigo-600 text-xs w-4"></i> Voter Slip Generator
          </button>
          <button onclick="navigateTo('thermal_printer'); closeRoleDrawer()" class="w-full text-left p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-xs flex items-center gap-2">
            <i class="fas fa-print text-slate-600 text-xs w-4"></i> Bluetooth Thermal Printer
          </button>
          <button onclick="navigateTo('kk_issues_home'); closeRoleDrawer()" class="w-full text-left p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-xs flex items-center gap-2">
            <i class="fas fa-circle-exclamation text-rose-500 text-xs w-4"></i> Raise Field Ticket
          </button>
          <button onclick="navigateTo('kk_ai_mode'); closeRoleDrawer()" class="w-full text-left p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-xs flex items-center gap-2">
            <i class="fas fa-wand-magic-sparkles text-indigo-500 text-xs w-4"></i> Field AI Assistant
          </button>
          <button onclick="navigateTo('blo_info'); closeRoleDrawer()" class="w-full text-left p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-xs flex items-center gap-2">
            <i class="fas fa-user-shield text-amber-600 text-xs w-4"></i> BLO Directory
          </button>
        `;
      } else {
        // STRICTLY KARYAKARTA ONLY: Zero Candidate-exclusive modules visible
        avatar.className = 'w-8 h-8 rounded-full bg-brand-600 text-white flex items-center justify-center font-bold text-xs';
        avatar.textContent = 'SP';
        name.textContent = state.auth.karyakarta.user.name;
        role.textContent = 'Assigned Karyakarta (Booth 12)';
        menu.innerHTML = `
          <button onclick="navigateTo('kk_dashboard'); closeRoleDrawer()" class="w-full text-left p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold">1. Field Dashboard</button>
          <button onclick="navigateTo('search_voter'); closeRoleDrawer()" class="w-full text-left p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold">2. Search Voter Roll</button>
          <button onclick="navigateTo('adv_search'); closeRoleDrawer()" class="w-full text-left p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold">3. Advanced Filters</button>
          <button onclick="navigateTo('bulk_survey_select'); closeRoleDrawer()" class="w-full text-left p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold">4. Bulk Survey Tool</button>
          <button onclick="navigateTo('kk_issues_home'); closeRoleDrawer()" class="w-full text-left p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold">5. Field Issue Tickets</button>
          <button onclick="navigateTo('kk_ai_mode'); closeRoleDrawer()" class="w-full text-left p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold text-indigo-500">6. AI Field Agent</button>
          <button onclick="navigateTo('thermal_printer'); closeRoleDrawer()" class="w-full text-left p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold">7. Bluetooth Thermal Printer</button>
          <button onclick="navigateTo('blo_info'); closeRoleDrawer()" class="w-full text-left p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold">8. BLO Contact Directory</button>
          <button onclick="navigateTo('settings_kk'); closeRoleDrawer()" class="w-full text-left p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 font-semibold">9. Field Settings</button>
        `;
      }

      backdrop.classList.remove('hidden');
      setTimeout(() => backdrop.classList.remove('opacity-0'), 10);
      drawer.classList.remove('translate-x-full');
    }

    function closeRoleDrawer() {
      const drawer = document.getElementById('sideDrawer');
      const backdrop = document.getElementById('sideDrawerBackdrop');
      if (drawer) drawer.classList.add('translate-x-full');
      if (backdrop) {
        backdrop.classList.add('opacity-0');
        setTimeout(() => backdrop.classList.add('hidden'), 200);
      }
    }

    function showCustomModal(title, category, contentHtmlOrText, onConfirm) {
      const modal = document.getElementById('customModal');
      document.getElementById('modalTitle').textContent = title;
      document.getElementById('modalCategory').textContent = category || 'System Action';
      document.getElementById('modalMessage').innerHTML = contentHtmlOrText;

      const confirmBtn = document.getElementById('modalConfirmBtn');
      confirmBtn.onclick = () => {
        closeCustomModal();
        if (typeof onConfirm === 'function') onConfirm();
      };

      modal.classList.remove('hidden');
    }

    function closeCustomModal() {
      const modal = document.getElementById('customModal');
      if (modal) modal.classList.add('hidden');
    }

    function confirmLogoutModal() {
      closeRoleDrawer();
      showCustomModal(
        'Confirm Session Logout',
        'Authentication Security',
        'Are you sure you want to exit your active workspace session? Unsaved drafts are cached locally.',
        () => {
          state.auth.karyakarta.loggedIn = false;
          state.auth.candidateAdmin.loggedIn = false;
          state.role = null;
          showToast('Session terminated successfully.', 'info');
          navigateTo('welcome');
        }
      );
    }

    let toastTimeout = null;
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toastNotification');
      const icon = document.getElementById('toastIcon');
      const msg = document.getElementById('toastMessage');

      if (!toast) return;

      msg.textContent = message;
      if (type === 'error') {
        icon.className = 'fas fa-circle-exclamation text-rose-400';
      } else if (type === 'info') {
        icon.className = 'fas fa-info-circle text-blue-400';
      } else {
        icon.className = 'fas fa-circle-check text-green-400';
      }

      toast.classList.remove('opacity-0', 'translate-y-16');
      toast.classList.add('opacity-100', 'translate-y-0');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-16');
      }, 2600);
    }

    function toggleTheme() {
      const html = document.documentElement;
      const icon = document.getElementById('themeIcon');
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        state.theme = 'light';
        if (icon) icon.className = 'fas fa-moon';
        showToast('Switched to Light Mode', 'info');
      } else {
        html.classList.add('dark');
        state.theme = 'dark';
        if (icon) icon.className = 'fas fa-sun';
        showToast('Switched to Dark Mode', 'info');
      }
    }

    function toggleDeviceFrame() {
      const container = document.getElementById('deviceContainer');
      const notch = document.getElementById('phoneNotch');
      state.deviceFrame = !state.deviceFrame;

      if (state.deviceFrame) {
        container.classList.add('sm:max-w-[420px]', 'sm:h-[840px]', 'sm:rounded-[36px]', 'mobile-frame-shadow');
        notch.classList.remove('hidden');
        notch.classList.add('sm:flex');
        showToast('Mobile Device Mockup View enabled', 'info');
      } else {
        container.classList.remove('sm:max-w-[420px]', 'sm:h-[840px]', 'sm:rounded-[36px]', 'mobile-frame-shadow');
        notch.classList.add('hidden');
        notch.classList.remove('sm:flex');
        showToast('Fluid Viewport View enabled', 'info');
      }
    }

    function changeLanguage(lang) {
      state.lang = lang;
      showToast(`Language set to ${lang === 'mr' ? 'मराठी' : (lang === 'hi' ? 'हिंदी' : 'English')}`, 'info');
      renderScreen(state.currentScreen);
    }

    window.onload = function () {
      navigateTo('welcome');
    };
  </script>
</body>
</html>
